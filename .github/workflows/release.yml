name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: volt
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: volt
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: volt
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: volt
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: volt.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile tools (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf volt-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          mv volt-${{ matrix.target }}.tar.gz ../../../

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ../../../volt-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: volt-${{ matrix.target }}
          path: volt-${{ matrix.target }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

    update-brew:
        name: Update Homebrew formula
        needs: release
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
            with:
              repository: frypan05/homebrew-volt
              token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              path: homebrew-volt

          - name: Compute checksums
            run: |
              echo "SHA_INTEL=$(curl -sL https://github.com/frypan05/Volt/releases/download/${{ github.ref_name }}/volt-x86_64-apple-darwin.tar.gz | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV
              echo "SHA_ARM=$(curl -sL https://github.com/frypan05/Volt/releases/download/${{ github.ref_name }}/volt-aarch64-apple-darwin.tar.gz | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV

          - name: Update version and checksums
            run: |
              VERSION=${{ github.ref_name }}
              VERSION=${VERSION#v}
              cd homebrew-volt
              sed -i "s/version \".*\"/version \"$VERSION\"/" Formula/volt.rb
              sed -i "0,/sha256 \".*\"/{s/sha256 \".*\"/sha256 \"$SHA_INTEL\"/}" Formula/volt.rb
              sed -i "0,/sha256 \".*\"/{/sha256 \"$SHA_INTEL\"/! s/sha256 \".*\"/sha256 \"$SHA_ARM\"/}" Formula/volt.rb

          - name: Push
            run: |
              cd homebrew-volt
              git config user.email "actions@github.com"
              git config user.name "GitHub Actions"
              git add Formula/volt.rb
              git commit -m "volt ${{ github.ref_name }}"
              git push
