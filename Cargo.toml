[package]
name = "volt"
version = "1.3.4"
edition = "2021"
description = "A terminal HTTP client for developers."
license = "MIT"
homepage = "https://github.com/frypan05/volt"
repository = "https://github.com/frypan05/volt"
readme = "README.md"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow     = "1.0"
arboard    = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
base64     = "0.22"
crossterm  = "0.28"
ignore     = "0.4"
ratatui    = "0.29"
regex      = "1.11"
reqwest    = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy    = "0.15"
syntect    = { version = "5.2", default-features = false, features = ["default-fancy"] }
thiserror  = "2.0"
tokio      = { version = "1.44", features = ["full"] }
toml       = "0.8"
once_cell = "1.21.4"
clap = { version = "4.5", features = ["derive"] }
inquire = "0.7"
directories = "6.0.0"
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
